# Versions pinned to those reported in the paper's Methods.
name: spyo-genomicus
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pandas=3
  - numpy
  - scipy
  - scikit-learn=1.8.0
  - matplotlib=3.10.9
  - plotly=6.6.0
  - seaborn
  - jupyterlab
  - openpyxl
  # --- bioinformatics tools used in steps 1-3 and the PopPUNK analysis ---
  - cd-hit=4.8.1
  - blast=2.17.0
  - diamond=2.1
  - mash=2.3
  - checkm-genome=1.2.2
  - emmtyper=0.2.2
  - mlst
  - poppunk=2.7.8
  - pip
  - pip:
      - pyphylon            # optNMF; https://github.com/SBRG/pyphylon
# Not available via conda; required only for steps 1-3:
#   Bakta v1.12.0 with database v6.0   https://github.com/oschwengers/bakta
#   PanTA (GitHub, April 2026)         https://github.com/amromics/panta
